name: Android Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.2

      - name: Install Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable/
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.android/
          mv debug.keystore ~/.android/debug.keystore

      # حذف کامل اکشن setup-android و استفاده از لایسنس پیش‌فرض
      - name: Export APK
        run: |
          mkdir -p build
          # اجرای اکسپورت با استفاده از SDK پیش‌فرض سیستم
          godot --headless --export-debug "Android" build/tak_khat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tak_khat-apk
          path: build/tak_khat.apk
